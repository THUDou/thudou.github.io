<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发博后台 · 豆豆的技术博客</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f7f8fb 0%, #eef1f7 100%);
      color: #1f2430;
    }
    .card {
      width: min(92vw, 460px); background: #fff; border-radius: 18px; padding: 36px 32px 30px;
      box-shadow: 0 18px 48px rgba(24, 32, 56, .10), 0 2px 6px rgba(24, 32, 56, .05);
      text-align: center;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 6px; }
    .logo span { color: #ff2d8a; }
    .sub { font-size: 13px; color: #6b7383; margin-bottom: 26px; }
    button.primary {
      width: 100%; padding: 13px 18px; border: 0; border-radius: 11px; cursor: pointer;
      font-size: 15px; font-weight: 600; color: #fff; background: #24292f;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      transition: transform .12s ease, background .2s ease, opacity .2s ease;
    }
    button.primary:hover { background: #000; transform: translateY(-1px); }
    button.primary:disabled { opacity: .55; cursor: default; transform: none; }
    button.ghost {
      width: 100%; margin-top: 10px; padding: 11px 16px; border-radius: 11px; cursor: pointer;
      font-size: 14px; font-weight: 500; color: #24292f; background: #f2f4f8; border: 1px solid #e3e7ef;
    }
    button.ghost:hover { background: #e9edf4; }
    .code-box { margin: 4px 0 14px; padding: 16px; border-radius: 13px; background: #f6f8fc; border: 1px dashed #ccd4e2; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 30px; font-weight: 700; letter-spacing: 3px; color: #111827; user-select: all;
    }
    .hint { font-size: 13px; line-height: 1.7; color: #5b6474; margin: 12px 0 0; }
    .hint a { color: #0969da; text-decoration: none; font-weight: 600; }
    .hint a:hover { text-decoration: underline; }
    .status { margin-top: 16px; font-size: 13px; color: #6b7383; min-height: 20px; }
    .status.ok { color: #1a7f37; font-weight: 600; }
    .status.err { color: #cf222e; font-weight: 600; }
    .spin {
      display: inline-block; width: 13px; height: 13px; border: 2px solid #cfd6e4;
      border-top-color: #24292f; border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
    [hidden] { display: none !important; }
    .mini { font-size: 12px; color: #98a1b0; margin-top: 18px; line-height: 1.6; }
    #cms-root { display: none; }
  </style>
</head>
<body>
  <div class="card" id="gate">
    <div class="logo">豆豆的<span>技术博客</span></div>
    <div class="sub">发博后台 · 使用 GitHub 账号登录</div>

    <div id="step-start">
      <button class="primary" id="btn-start">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        用 GitHub 登录
      </button>
      <p class="mini">首次登录需在 GitHub 输入一次验证码，之后会自动记住登录状态。</p>
    </div>

    <div id="step-code" hidden>
      <div class="code-box">
        <div class="code" id="usercode">····-····</div>
      </div>
      <button class="ghost" id="btn-open">打开 GitHub 授权页 ↗</button>
      <p class="hint">在上面打开的页面里输入这串验证码，然后点 <b>Authorize</b>。本页会自动检测并进入后台。</p>
      <div class="status" id="status"><span class="spin"></span>等待授权…</div>
    </div>

    <div id="step-error" hidden>
      <p class="status err" id="errmsg">出错了</p>
      <button class="ghost" id="btn-retry">重试</button>
    </div>
  </div>

  <script>
    // ── 配置 ──────────────────────────────────────────────
    // GitHub OAuth App 的 Client ID（公开信息）。已开启 Device Flow。
    var CLIENT_ID = 'Ov23limrxKWTEXOAFIdF';
    var SCOPE = 'repo';                     // 读写仓库
    var STORAGE_KEY = 'decap-cms-user';     // Decap CMS 读取登录态的键
    var VERIFIER_KEY = 'decap-cms-pkce-verifier-code';
    // ──────────────────────────────────────────────────────

    function $(id) { return document.getElementById(id); }
    function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

    function getToken() {
      try {
        var u = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        return u && u.token ? u.token : null;
      } catch (e) { return null; }
    }

    function show(id) {
      var list = ['step-start', 'step-code', 'step-error'];
      for (var i = 0; i < list.length; i++) $(list[i]).hidden = (list[i] !== id);
    }

    function fail(msg) { show('step-error'); $('errmsg').textContent = msg; }

    function verifyToken(token) {
      return fetch('https://api.github.com/user', {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
      }).then(function (r) {
        if (!r.ok) return false;
        return r.json().then(function (u) {
          return { login: u.login, name: u.name || u.login, email: u.email || '' };
        });
      }).catch(function () { return null; });   // 网络异常 → null，不拦
    }

    function loadCMS() {
      $('gate').style.display = 'none';
      var s = document.createElement('script');
      s.src = './decap-cms.js';
      document.body.appendChild(s);
    }

    async function startDeviceFlow() {
      $('btn-start').disabled = true;
      try {
        var r = await fetch('https://github.com/login/device/code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
          body: 'client_id=' + encodeURIComponent(CLIENT_ID) + '&scope=' + encodeURIComponent(SCOPE)
        });
        var d = await r.json();
        if (!d.device_code) {
          $('btn-start').disabled = false;
          return fail('无法获取验证码：' + (d.error_description || d.error || '未知错误'));
        }

        show('step-code');
        $('usercode').textContent = d.user_code;
        $('btn-open').onclick = function () {
          window.open(d.verification_uri || 'https://github.com/login/device', '_blank', 'noopener');
        };
        try { await navigator.clipboard.writeText(d.user_code); } catch (e) {}

        var interval = (d.interval || 5) * 1000;
        var deadline = Date.now() + (d.expires_in || 900) * 1000;
        var statusEl = $('status');

        while (Date.now() < deadline) {
          await sleep(interval);
          var t;
          try {
            var tr = await fetch('https://github.com/login/oauth/access_token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded', Accept: 'application/json' },
              body: 'client_id=' + encodeURIComponent(CLIENT_ID) +
                '&device_code=' + encodeURIComponent(d.device_code) +
                '&grant_type=' + encodeURIComponent('urn:ietf:params:oauth:grant-type:device_code')
            });
            t = await tr.json();
          } catch (e) { continue; }

          if (t.access_token) {
            statusEl.className = 'status ok';
            statusEl.textContent = '✓ 授权成功，正在进入后台…';
            var info = (await verifyToken(t.access_token)) || {};
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              token: t.access_token,
              provider: 'github',
              backendName: 'github',
              login: info.login,
              name: info.name,
              email: info.email
            }));
            setTimeout(function () { location.replace(location.pathname + location.search); }, 250);
            return;
          }
          if (t.error === 'authorization_pending') continue;
          if (t.error === 'slow_down') { interval += 5000; continue; }
          if (t.error === 'expired_token') return fail('验证码已过期，请重新登录');
          if (t.error === 'access_denied') return fail('你取消了授权');
          return fail(t.error_description || t.error || '授权失败');
        }
        fail('等待超时，请重试');
      } catch (e) {
        $('btn-start').disabled = false;
        fail('网络错误（访问 GitHub 需开代理）：' + String(e).slice(0, 80));
      }
    }

    $('btn-start').onclick = startDeviceFlow;
    $('btn-retry').onclick = function () { $('btn-start').disabled = false; show('step-start'); };

    // 启动：有有效 token 直接进后台，否则显示登录
    (async function boot() {
      var token = getToken();
      if (!token) return show('step-start');
      var info = await verifyToken(token);
      if (info) return loadCMS();          // 有效
      if (info === null) return loadCMS(); // 网络不通 → 交给 CMS
      localStorage.removeItem(STORAGE_KEY);
      show('step-start');
    })();
  </script>
</body>
</html>
