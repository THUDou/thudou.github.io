<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发博后台 · 豆豆的技术博客</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #f7f8fb 0%, #eef1f7 100%);
      color: #1f2430; padding: 24px 16px;
    }
    .card {
      width: min(94vw, 520px); background: #fff; border-radius: 18px; padding: 34px 30px 28px;
      box-shadow: 0 18px 48px rgba(24, 32, 56, .10), 0 2px 6px rgba(24, 32, 56, .05);
    }
    .head { text-align: center; }
    .logo { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
    .logo span { color: #ff2d8a; }
    .sub { font-size: 13px; color: #6b7383; margin: 6px 0 24px; }
    button {
      width: 100%; padding: 12px 16px; border-radius: 11px; cursor: pointer; font-size: 14.5px;
      font-weight: 600; border: 1px solid transparent; transition: all .16s ease;
    }
    button.primary { color: #fff; background: #24292f; display: inline-flex; align-items: center; justify-content: center; gap: 9px; }
    button.primary:hover { background: #000; transform: translateY(-1px); }
    button.primary:disabled { opacity: .5; cursor: default; transform: none; }
    button.ghost { color: #24292f; background: #f2f4f8; border-color: #e3e7ef; font-weight: 500; }
    button.ghost:hover { background: #e9edf4; }
    .steps { margin: 18px 0 0; padding: 0; list-style: none; counter-reset: s; }
    .steps li {
      counter-increment: s; position: relative; padding: 0 0 14px 34px;
      font-size: 13.5px; line-height: 1.65; color: #3d4657;
    }
    .steps li::before {
      content: counter(s); position: absolute; left: 0; top: 1px; width: 22px; height: 22px;
      border-radius: 50%; background: #eef1f7; color: #4a5568; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .steps a { color: #0969da; text-decoration: none; font-weight: 600; word-break: break-all; }
    .steps a:hover { text-decoration: underline; }
    .token-row { display: flex; gap: 8px; margin-top: 4px; }
    .token-row input {
      flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px; border: 1px solid #d8dee9;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: #1f2430;
      outline: none; transition: border-color .15s ease, box-shadow .15s ease;
    }
    .token-row input:focus { border-color: #24292f; box-shadow: 0 0 0 3px rgba(36, 41, 47, .08); }
    .token-row button { width: auto; padding: 11px 18px; white-space: nowrap; }
    .status { margin-top: 14px; font-size: 13px; min-height: 19px; text-align: center; }
    .status.ok { color: #1a7f37; font-weight: 600; }
    .status.err { color: #cf222e; font-weight: 600; }
    .foot { margin-top: 20px; padding-top: 16px; border-top: 1px solid #eef1f6; font-size: 11.5px; line-height: 1.7; color: #98a1b0; text-align: center; }
    [hidden] { display: none !important; }
    .linkish { background: none; border: 0; padding: 0; width: auto; color: #0969da; font-size: 12px; font-weight: 600; cursor: pointer; }
    .linkish:hover { text-decoration: underline; }
    .center { text-align: center; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card" id="gate">
    <div class="head">
      <div class="logo">豆豆的<span>技术博客</span></div>
      <div class="sub">发博后台</div>
    </div>

    <div id="step-start">
      <button class="primary" id="btn-start">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        用 GitHub 令牌登录
      </button>
      <div class="center"><button class="linkish" id="btn-help">怎么获取令牌？</button></div>
    </div>

    <div id="step-token" hidden>
      <ol class="steps">
        <li>打开 <a id="tok-link" href="https://github.com/settings/tokens/new?scopes=repo&description=%E8%B1%86%E8%B1%86%E5%8D%9A%E5%AE%A2%E5%8F%91%E5%8D%9A%E5%90%8E%E5%8F%B0" target="_blank" rel="noopener">github.com/settings/tokens/new</a>（权限已预填好 <code>repo</code>，需先开代理）</li>
        <li>页面底部点 <b>Generate token</b>，复制以 <code>ghp_</code> 开头的令牌</li>
        <li>粘贴到下面，点登录</li>
      </ol>
      <div class="token-row">
        <input id="tok-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false">
        <button class="primary" id="btn-save">登录</button>
      </div>
      <div class="status" id="status"></div>
      <div class="center"><button class="linkish" id="btn-back">返回</button></div>
    </div>

    <div class="foot">
      令牌只保存在你自己的浏览器（localStorage），不会上传到任何服务器。<br>
      换电脑或清理浏览器数据后需要重新登录一次。
    </div>
  </div>

  <script>
    var STORAGE_KEY = 'decap-cms-user';
    function $(id) { return document.getElementById(id); }

    function getToken() {
      try {
        var u = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        return u && u.token ? u.token : null;
      } catch (e) { return null; }
    }

    function show(id) {
      ['step-start', 'step-token'].forEach(function (s) { $(s).hidden = (s !== id); });
    }

    function setStatus(msg, cls) {
      var el = $('status');
      el.className = 'status' + (cls ? ' ' + cls : '');
      el.textContent = msg || '';
    }

    function verifyToken(token) {
      return fetch('https://api.github.com/user', {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' }
      }).then(function (r) {
        if (r.status === 401) return false;
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }

    function loadCMS() {
      $('gate').style.display = 'none';
      var s = document.createElement('script');
      s.src = './decap-cms.js';
      document.body.appendChild(s);
    }

    $('btn-start').onclick = function () { show('step-token'); setStatus(''); $('tok-input').focus(); };
    $('btn-help').onclick = function () { show('step-token'); setStatus(''); };
    $('btn-back').onclick = function () { show('step-start'); setStatus(''); };

    $('btn-save').onclick = async function () {
      var val = ($('tok-input').value || '').trim();
      if (!val) return setStatus('请粘贴令牌', 'err');
      if (!/^(ghp_|github_pat_|gho_|ghu_)/.test(val)) {
        return setStatus('令牌格式不对，应该以 ghp_ 或 github_pat_ 开头', 'err');
      }
      $('btn-save').disabled = true;
      setStatus('验证中…');
      try {
        var u = await verifyToken(val);
        if (!u) { setStatus('令牌无效或已过期，请重新生成', 'err'); $('btn-save').disabled = false; return; }
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          token: val, provider: 'github', backendName: 'github',
          login: u.login, name: u.name || u.login, email: u.email || ''
        }));
        setStatus('✓ 登录成功，正在进入后台…', 'ok');
        setTimeout(function () { location.reload(); }, 350);
      } catch (e) {
        setStatus('连不上 GitHub（需开代理）：' + String(e.message).slice(0, 60), 'err');
        $('btn-save').disabled = false;
      }
    };

    $('tok-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') $('btn-save').click();
    });

    // 启动：有有效 token 直接进后台
    (async function boot() {
      var token = getToken();
      if (!token) return show('step-start');
      try {
        var u = await verifyToken(token);
        if (u) return loadCMS();
        if (u === false) { localStorage.removeItem(STORAGE_KEY); return show('step-start'); }
      } catch (e) {
        // 网络不通时先让 CMS 自己判断，避免断网打不开
        return loadCMS();
      }
      show('step-start');
    })();
  </script>
</body>
</html>
